<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Gatos🐾</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
        <div class="nav-links">
            <header>
                <h2>Menú</h2>
                <nav>
                    <a href="index.html">Inicio</a><br>
                    <a href="lista-gatos.html">Lista de Gatos🐱</a>
                </nav>
            </header>
        </div>

        <h1>Agregar Gato🐾</h1>

        <form id="formGato">

            <!-- Nombre -->
            <div class="campo">
                <label for="nombre">Nombre del gatito</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej: Pelusa">
                <span id="errorNombre" class="error"></span>
            </div>

            <!-- Color -->
            <div class="campo">

                <label for="color">Color de pelaje</label>

                <input
                    type="text"
                    id="color"
                    name="color"
                    placeholder="Ej: Naranja, Blanco, Gris">

                <span id="errorColor" class="error"></span>

            </div>

            <!-- Edad -->
            <div class="campo">

                <label for="edad">Edad (en años)</label>

                <input
                    type="number"
                    id="edad"
                    name="edad"
                    placeholder="Ej: 3">

                <span id="errorEdad" class="error"></span>

            </div>

            <button type="submit">
                Agregar Gato
            </button>
            <button
                type="reset"
                class="btn-limpiar">
                Limpiar
            </button>

        </form>

        <div id="mensaje" class="exito"></div>

    </div>

    <script>

        const formulario =
            document.getElementById("formGato");

        formulario.addEventListener("submit", function(event) {

            // Evita que el formulario se envíe
            event.preventDefault();

            // Obtener valores
            const color =
                document.getElementById("color").value.trim();

            const nombre =
                document.getElementById("nombre").value.trim();

            const edad =
                document.getElementById("edad").value.trim();

            // Limpiar mensajes
            document.getElementById("errorColor").textContent = "";
            document.getElementById("errorNombre").textContent = "";
            document.getElementById("errorEdad").textContent = "";
            document.getElementById("mensaje").textContent = "";

            let valido = true;

            // Validar color
            if (color === "") {

                document.getElementById("errorColor")
                    .textContent = "Debe ingresar el color.";

                valido = false;
            }

            // Validar nombre
            if (nombre === "") {

                document.getElementById("errorNombre")
                    .textContent = "Debe ingresar el nombre.";

                valido = false;
            }

            // Validar edad
            if (edad === "") {

                document.getElementById("errorEdad")
                    .textContent = "Debe ingresar la edad.";

                valido = false;
            }

            // Resultado
            if (valido) {

                const gatos = JSON.parse(localStorage.getItem("gatos")) || [];

                const gato = {
                    color: color,
                    nombre: nombre,
                    edad: edad
                };

                gatos.push(gato);

                localStorage.setItem("gatos", JSON.stringify(gatos));

                document.getElementById("mensaje")
                    .textContent =
                    "Gato agregado correctamente.";

                formulario.reset();
            }

        });

    </script>

</body>

</html>
