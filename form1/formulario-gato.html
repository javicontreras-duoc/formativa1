<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Gatos🐾</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
        <div class="nav-links">
            <header>
                <h2>Menú</h2>
                <nav>
                    <ul>
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="lista-gatos.html">Lista de Gatos🐱</a></li>
                    </ul>
                </nav>
            </header>
        </div>
        <h1>Agregar Gato🐾</h1>
        <div class="img-container">
            <img src="https://cdn.pixabay.com/photo/2016/11/23/14/57/cat-1853372_1280.jpg" alt="Gato recostado" class="img-pagina">
        </div>

        <form id="formGato">

            <!-- Nombre -->
            <div class="campo">
                <label for="nombre">Nombre del gatito</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej: Pelusa">
                <span id="errorNombre" class="error"></span>
            </div>

            <!-- Color -->
            <div class="campo">

                <label for="color">Color de pelaje</label>

                <input
                    type="text"
                    id="color"
                    name="color"
                    placeholder="Ej: Naranja, Blanco, Gris">

                <span id="errorColor" class="error"></span>

            </div>

            <!-- Edad -->
            <div class="campo">

                <label for="edad">Edad (en años)</label>

                <input
                    type="number"
                    id="edad"
                    name="edad"
                    placeholder="Ej: 3">

                <span id="errorEdad" class="error"></span>

            </div>

            <button type="submit">
                Agregar Gato
            </button>
            <button
                type="reset"
                class="btn-limpiar">
                Limpiar
            </button>

        </form>

        <div id="mensaje" class="exito"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
