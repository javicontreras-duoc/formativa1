<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Gatos🐱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
            <div class="nav-links">
                <header>
                    <h2>Menú</h2>
                    <nav>
                        <ul>
                            <li><a href="index.html">Inicio</a></li>
                            <li><a href="formulario-gato.html">Registrar Gatos🐾</a></li>
                        </ul>
                    </nav>
                </header>
            </div>
        <h2>Gatos registrados🐱</h2>
        <p id="mensajeVacio"></p>

        <table id="tablaGatos">
            <thead>
                <tr>
                    <th>Color</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
    </div>
    

    <script>
        const cuerpoTabla = document.getElementById("cuerpoTabla");
        const mensajeVacio = document.getElementById("mensajeVacio");

        const gatos = JSON.parse(localStorage.getItem("gatos")) || [];

        if (gatos.length === 0) {
            mensajeVacio.textContent = "Aún no hay gatitos en el registro. ¡Agrega el primero!";
        } else {
            gatos.forEach(gato => {
                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>${gato.nombre}</td>
                    <td>${gato.color}</td>
                    <td>${gato.edad} ${gato.edad == 1 ? 'año' : 'años'}</td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        }

    </script>
</body>
</html>
