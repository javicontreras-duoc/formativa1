<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Gatos</title>
</head>
<body>
    <header>
            <h2>Menú</h2>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="formulario-producto.html">Registrar Gatos</a></li>
                </ul>
            </nav>
        </header>
    <div class="container">
        <h2>Gatos registrados</h2>
        <p id="mensajeVacio"></p>

        <table id="tablaGatos">
            <thead>
                <tr>
                    <th>Color</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
    </div>
    

    <script>
        const cuerpoTabla = document.getElementById("cuerpoTabla");
        const mensajeVacio = document.getElementById("mensajeVacio");

        const gatos = JSON.parse(localStorage.getItem("gatos")) || [];

        if (gatos.length === 0) {
            mensajeVacio.textContent = "No hay gatos registrados.";
        } else {
            gatos.forEach(gato => {
                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>${gato.color}</td>
                    <td>${gato.nombre}</td>
                    <td>${gato.edad}</td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        }

    </script>
</body>
</html>
